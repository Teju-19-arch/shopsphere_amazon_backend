
services:
  amazon-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: shopsphere-amazon
    container_name: shopsphere-amazon-api
    expose:
      - "8000"
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - amazon-api
    restart: unless-stopped